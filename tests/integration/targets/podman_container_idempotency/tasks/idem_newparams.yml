---
# Tests for new parameters added in Podman 5.3+
- name: Remove leftovers from other tests
  containers.podman.podman_container:
    executable: "{{ test_executable | default('podman') }}"
    name: idempotency
    state: absent

# ===== hosts_file idempotency (v5.4+) =====
- name: Test hosts_file parameter
  when: podman_v.stdout is version('5.4.0', '>=')
  block:
    - name: Run container with hosts_file none
      containers.podman.podman_container:
        executable: "{{ test_executable | default('podman') }}"
        image: "{{ idem_image }}"
        name: idempotency
        state: started
        hosts_file: "none"
        command: 1h

    - name: Run container with hosts_file none again
      containers.podman.podman_container:
        executable: "{{ test_executable | default('podman') }}"
        image: "{{ idem_image }}"
        name: idempotency
        state: present
        hosts_file: "none"
        command: 1h
      register: hosts_file_test1

    - name: Check hosts_file idempotency
      assert:
        that: hosts_file_test1 is not changed

    - name: Change hosts_file to image
      containers.podman.podman_container:
        executable: "{{ test_executable | default('podman') }}"
        image: "{{ idem_image }}"
        name: idempotency
        state: present
        hosts_file: "image"
        command: 1h
      register: hosts_file_test2

    - name: Check hosts_file changed
      assert:
        that: hosts_file_test2 is changed

    - name: Cleanup hosts_file test
      containers.podman.podman_container:
        executable: "{{ test_executable | default('podman') }}"
        name: idempotency
        state: absent

