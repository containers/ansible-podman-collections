# ===== log_opt freeform dict test =====
- name: Run container with log_opt tag
  containers.podman.podman_container:
    executable: "{{ test_executable | default('podman') }}"
    image: "{{ idem_image }}"
    name: idempotency
    state: started
    log_driver: journald
    log_opt:
      tag: "mycontainer"
    command: 1h

- name: Run container with same log_opt again
  containers.podman.podman_container:
    executable: "{{ test_executable | default('podman') }}"
    image: "{{ idem_image }}"
    name: idempotency
    state: present
    log_driver: journald
    log_opt:
      tag: "mycontainer"
    command: 1h
  register: log_opt_test1

- name: Check log_opt idempotency
  assert:
    that: log_opt_test1 is not changed

- name: Cleanup log_opt test
  containers.podman.podman_container:
    executable: "{{ test_executable | default('podman') }}"
    name: idempotency
    state: absent

- name: Final cleanup
  containers.podman.podman_container:
    executable: "{{ test_executable | default('podman') }}"
    name: idempotency
    state: absent
